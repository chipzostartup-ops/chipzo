name: chipzo-daily

on:
  schedule:
    # GitHub cron is UTC. These land at 09:30, 18:30 and 00:30 IST.
    # They are deliberately a few minutes AFTER the publish slots (09:00 blog,
    # 18:30 Telegram) because the dispatcher only sends items whose time has
    # already passed.
    - cron: "0 4,13,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publishing)"
        type: boolean
        default: false

concurrency:
  group: chipzo-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Report which secrets are present instead of deciding for the run.
      # A missing secret must never stop the other channels from working: the
      # dispatcher already degrades per channel and records why in the queue.
      - name: Check secrets
        run: |
          core="TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID SMTP_HOST SMTP_USER SMTP_PASSWORD"
          extra="BLOGGER_EMAIL SMTP_PORT SMTP_FROM"
          missing=0
          for name in $core; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is missing - that channel will be skipped"
              missing=$((missing + 1))
            else
              echo "ok    $name"
            fi
          done
          for name in $extra; do
            if [ -z "${!name}" ]; then
              echo "warn  $name not set (a default is used)"
            else
              echo "ok    $name"
            fi
          done
          echo "---"
          if [ "$missing" -gt 0 ]; then
            echo "$missing core secret(s) missing. Add them in Settings -> Secrets and variables -> Actions."
          else
            echo "All core secrets present."
          fi
          # Deliberately exit 0: a partial setup should still publish what it can.

      # The subscriber list is private, so it never lives in this public repo.
      # It is stored as the SUBSCRIBERS_CSV secret and materialised here.
      - name: Load subscribers (optional)
        env:
          SUBSCRIBERS_CSV: ${{ secrets.SUBSCRIBERS_CSV }}
        run: |
          if [ -n "$SUBSCRIBERS_CSV" ]; then
            mkdir -p automation/state
            printf '%s\n' "$SUBSCRIBERS_CSV" > automation/state/subscribers.csv
            echo "subscribers: $(( $(wc -l < automation/state/subscribers.csv) - 1 ))"
          else
            echo "no SUBSCRIBERS_CSV secret - email items stay manual"
          fi

      - name: Regenerate platform files
        run: python automation/repurpose.py --all

      - name: Sync the queue
        run: python automation/queue.py build

      - name: Publish what is due
        env:
          CHIPZO_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        # 180 minutes, not 30: one missed run (a GitHub outage, a red build)
        # should not silently kill the whole day's slot forever.
        run: python automation/run_daily.py --tolerance-min 180 --reset-failed

      # The queue remembers what was already sent. Without this the next run
      # would rebuild from scratch and republish everything.
      - name: Persist publish state
        if: always()
        run: |
          git config user.name  "chipzo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f automation/state/queue.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: publish state [skip ci]"
            git push
          fi

      - name: Dashboard artifact
        if: always()
        run: python automation/dashboard.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chipzo-state
          path: |
            automation/state/queue.json
            automation/state/manual_tasks.md
            dashboard/index.html
          retention-days: 14
          if-no-files-found: ignore
