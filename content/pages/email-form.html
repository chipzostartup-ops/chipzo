<!--
  Chipzo email signup — plain HTML POST to Brevo, no JavaScript.

  The only thing that changes per account is ACTION_URL: the `action` attribute
  below. Get it from Brevo -> Contacts -> Forms -> your form -> Share ->
  "Add it to your website" -> the <form action="..."> URL (starts with
  https://xxxx.sibforms.com/serve/).

  Brevo needs the three hidden inputs: email_address_check (honeypot, must stay
  empty), locale, and the EMAIL field name exactly as written.
-->

<div style="max-width:560px;margin:0 auto;font-family:Inter,Arial,Helvetica,sans-serif">

  <div style="border:1px solid #e4e7ec;border-radius:12px;padding:28px 26px;background:#ffffff">

    <p style="margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0a8f6b">
      Chipzo &middot; By email
    </p>

    <h2 style="margin:0 0 8px;font-size:24px;line-height:1.25;color:#111">
      One VLSI concept, every morning
    </h2>

    <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#555">
      The same articles that go on this blog, plus the interview question of the
      day. No spam, unsubscribe in one click.
    </p>

    <form method="POST" action="{{ACTION_URL}}">
      <input
        type="email"
        name="EMAIL"
        required
        placeholder="you@example.com"
        aria-label="Email address"
        style="width:100%;box-sizing:border-box;padding:13px 14px;font-size:15px;border:1px solid #d5d9e0;border-radius:8px;margin:0 0 10px;color:#111">

      <button
        type="submit"
        style="width:100%;padding:13px 14px;font-size:15px;font-weight:700;color:#04211a;background:#00b884;border:none;border-radius:8px;cursor:pointer">
        Send me the next one
      </button>

      <!-- Brevo requirements: keep all three -->
      <input type="text" name="email_address_check" value="" style="display:none" tabindex="-1" autocomplete="off">
      <input type="hidden" name="locale" value="en">
    </form>

    <p style="margin:14px 0 0;font-size:12px;line-height:1.5;color:#8a8f98">
      Roughly one email a day. Nothing sold, nothing shared.
    </p>

  </div>

</div>
